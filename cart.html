<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Cart | LFT'S ROYAL BITES</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #3b2605 0%, #120d05 35%, #050505 75%);
    }

    .gold-text {
      background: linear-gradient(90deg, #facc15, #f59e0b, #fde68a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .glass {
      background: rgba(28, 22, 12, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(245, 158, 11, 0.25);
    }

    .food-card {
      background: linear-gradient(135deg, #211707, #120d05);
      border: 1px solid rgba(245, 158, 11, 0.22);
    }
  </style>
</head>

<body class="min-h-screen text-white">

  <!-- HEADER -->
  <header class="sticky top-0 z-50 bg-black/90 backdrop-blur-md border-b border-amber-500/20">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">

      <div>
        <h1 class="text-2xl font-extrabold gold-text">
          LFT'S ROYAL BITES
        </h1>
        <p class="text-xs text-gray-400">
          Delicious food, royal taste 👑
        </p>
      </div>

      <a href="index.html"
         class="bg-amber-500 hover:bg-amber-400 text-black font-bold px-4 py-2 rounded-xl transition">
        ← Menu
      </a>

    </div>
  </header>


  <!-- CART -->
  <main class="max-w-3xl mx-auto px-4 py-8">

    <div class="text-center mb-7">
      <div class="text-5xl mb-3">🛒</div>

      <h2 class="text-3xl font-extrabold gold-text">
        Your Royal Cart
      </h2>

      <p class="text-gray-400 mt-2">
        Your favourite food is waiting for you ❤️
      </p>
    </div>


    <!-- CART ITEMS -->
    <div id="cart-list" class="space-y-4">
      <!-- Items will appear here -->
    </div>


    <!-- EMPTY CART -->
    <div id="empty-cart"
         class="glass rounded-2xl p-10 text-center hidden">

      <div class="text-6xl mb-4">🍽️</div>

      <h3 class="text-xl font-bold text-amber-400">
        Your cart is empty
      </h3>

      <p class="text-gray-400 text-sm mt-2 mb-6">
        Add something delicious from our menu.
      </p>

      <a href="index.html"
         class="inline-block bg-amber-500 hover:bg-amber-400 text-black font-bold px-6 py-3 rounded-xl">
        🍴 Explore Menu
      </a>

    </div>


    <!-- TOTAL -->
    <div id="cart-summary"
         class="glass rounded-2xl p-5 mt-6 hidden">

      <div class="flex justify-between items-center mb-2">
        <span class="text-gray-400">Items</span>
        <span id="total-items" class="font-bold">0</span>
      </div>

      <div class="border-t border-amber-500/20 my-4"></div>

      <div class="flex justify-between items-center">
        <span class="text-xl font-bold">
          Grand Total
        </span>

        <span id="total-price"
              class="text-2xl font-extrabold text-amber-400">
          ₹0
        </span>
      </div>

      <!-- UPI -->
      <button onclick="payNow()"
              class="w-full mt-6 bg-gradient-to-r from-amber-500 to-yellow-400 hover:from-yellow-400 hover:to-amber-400 text-black font-extrabold py-4 rounded-xl text-lg shadow-lg transition">
        💳 Pay via UPI
      </button>

      <p class="text-center text-xs text-gray-500 mt-3">
        Secure UPI payment • Fast & Easy
      </p>

    </div>

  </main>


  <!-- FOOTER -->
  <footer class="text-center text-gray-500 text-xs py-8">
    © 2026 LFT'S ROYAL BITES • Made with ❤️
  </footer>


<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

const cartList = document.getElementById("cart-list");
const emptyCart = document.getElementById("empty-cart");
const cartSummary = document.getElementById("cart-summary");
const totalPrice = document.getElementById("total-price");
const totalItems = document.getElementById("total-items");


function renderCart() {

  cartList.innerHTML = "";

  if (cart.length === 0) {

    emptyCart.classList.remove("hidden");
    cartSummary.classList.add("hidden");

    return;
  }

  emptyCart.classList.add("hidden");
  cartSummary.classList.remove("hidden");

  let total = 0;
  let itemsCount = 0;


  cart.forEach((item, index) => {

    let itemTotal = item.price * item.quantity;

    total += itemTotal;
    itemsCount += item.quantity;


    const card = document.createElement("div");

    card.className =
      "food-card rounded-2xl p-5 shadow-xl";


    card.innerHTML = `

      <div class="flex justify-between gap-4">

        <div class="flex-1">

          <h3 class="text-lg font-bold text-white">
            🍽️ ${item.name}
          </h3>

          <p class="text-sm text-gray-400 mt-1">
            ₹${item.price} each
          </p>

          <div class="flex items-center gap-3 mt-4">

            <button
              onclick="decreaseQty(${index})"
              class="w-9 h-9 rounded-lg bg-stone-800 border border-amber-500/30 text-amber-400 font-bold text-lg">
              −
            </button>

            <span class="font-bold text-lg min-w-[25px] text-center">
              ${item.quantity}
            </span>

            <button
              onclick="increaseQty(${index})"
              class="w-9 h-9 rounded-lg bg-amber-500 text-black font-bold text-lg">
              +
            </button>

            <button
              onclick="removeItem(${index})"
              class="ml-2 text-red-400 text-xs font-bold hover:text-red-300">
              REMOVE
            </button>

          </div>

        </div>


        <div class="text-right">

          <p class="text-xl font-extrabold text-amber-400">
            ₹${itemTotal}
          </p>

        </div>

      </div>
    `;

    cartList.appendChild(card);

  });


  totalPrice.innerText = "₹" + total;
  totalItems.innerText = itemsCount;

}


function increaseQty(index) {

  cart[index].quantity++;

  saveCart();

}


function decreaseQty(index) {

  if (cart[index].quantity > 1) {

    cart[index].quantity--;

  } else {

    cart.splice(index, 1);

  }

  saveCart();

}


function removeItem(index) {

  cart.splice(index, 1);

  saveCart();

}


function saveCart() {

  localStorage.setItem("cart", JSON.stringify(cart));

  renderCart();

}


function payNow() {

  if (cart.length === 0) {

    alert("Your cart is empty!");

    return;

  }


  let total = cart.reduce(
    (sum, item) => sum + (item.price * item.quantity),
    0
  );


  const upiUrl =
    `upi://pay?pa=8057928785@ybl&pn=Faiz&am=${total}&cu=INR`;

  window.location.href = upiUrl;

}


renderCart();

</script>

</body>
</html>
